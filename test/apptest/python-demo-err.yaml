apiVersion: v1
kind: Namespace
metadata:
  name: app-python
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-demo-err
  namespace: app-python
  labels:
    app: python-demo-err
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-demo-err
  template:
    metadata:
      labels:
        app: python-demo-err
    spec:
      containers:
        - name: python-demo-err
          image: demo-python:1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-c"]
          args:
            - |
              import sys, time
              print("python-demo-err: Fatal: cannot connect to backend db (ConnectionRefusedError)", file=sys.stderr)
              time.sleep(3)
              sys.exit(1)
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
