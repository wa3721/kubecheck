apiVersion: v1
kind: Namespace
metadata:
  name: app-java
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-demo-err
  namespace: app-java
  labels:
    app: spring-demo-err
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-demo-err
  template:
    metadata:
      labels:
        app: spring-demo-err
    spec:
      containers:
        - name: spring-demo-err
          image: demo-java:1.0
          imagePullPolicy: IfNotPresent
          # 指向不存在的配置文件，Spring Boot 启动时 ConfigDataException
          # -> ApplicationContext 刷新失败 -> 进程非零退出
          args:
            - "--spring.config.location=/nonexistent/application.yml"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
