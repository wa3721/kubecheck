apiVersion: v1
kind: Namespace
metadata:
  name: app-java
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-probe
  namespace: app-java
  labels:
    app: spring-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-probe
  template:
    metadata:
      labels:
        app: spring-probe
    spec:
      containers:
        - name: spring-probe
          image: demo-java:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          # startup：Spring Boot 启动较慢，用 startup 探针保护，
          # 避免在 JVM 预热期间被 liveness 误杀
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
            successThreshold: 1
          # readiness：就绪判断，成功后加入 Service 端点
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          # liveness：存活判断，比 readiness 更宽松避免抖动重启
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
