apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashdeploy
  namespace: dev
  labels:
    app: crashdeploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashdeploy
  template:
    metadata:
      labels:
        app: crashdeploy
    spec:
      containers:
        - name: nginx
          image: dockerproxy.net/library/nginx:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              nginx &
              NPID=$!
              sleep 5
              echo "[ERROR] simulated crash after 5s"
              kill $NPID
              exit 1
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 5
          ports:
            - containerPort: 80
