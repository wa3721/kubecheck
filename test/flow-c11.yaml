# 测试用例 c11：checker 多副本聚合分支
# 覆盖代码：checker 中对多副本（replicas=2）多 Pod 各起 goroutine 追踪，
#           以及聚合等待所有 Pod 结果后统一退出的逻辑。
# 场景：replicas=2，两个副本均先就绪（sleep 30 内均 Ready，阶段1 通过），
#       观察期内均以 exit 3 报错退出。验证多副本聚合：每个 Pod 独立 goroutine 追踪，
#       任一（此处全部）Pod 异常退出，最终 wg 聚合后以 exit 3 结束并告警、各自落盘。
# 注意：必须"先就绪再退出"，否则 Pod 永不 Ready，阶段1 前置阻断先超时（exit 2）。
# 运行：
#   kubectl-check deployment/flow-c11 -n flowtest \
#     --log-error-dir /tmp/flowlogs --log-error-keyword ERROR \
#     --pod-ready-timeout 30 --log-check-timeout 90
# 期望：exit 3；告警指向报错的 Pod 及对应落盘日志文件（2 个副本各一个 .log）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-c11
  namespace: flowtest
  labels:
    app: flow-c11
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flow-c11
  template:
    metadata:
      labels:
        app: flow-c11
    spec:
      containers:
        - name: flow-c11
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args: ["sleep 30; echo '[ERROR] instance failed'; exit 3"]
